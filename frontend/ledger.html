<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/styleTW.css" />
  <title>Ledger — Vestro</title>
</head>
<body class="ledger-view">

<div class="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-id">
      <p class="eyebrow">Vestro / Ledger</p>
      <h1 class="display display--compact">Ledger</h1>
      <p class="topbar-note">Every payment recognised is written as a balanced pair of entries.</p>
    </div>

    <div class="topbar-right">
      <div class="topbar-meta">
        <span class="status" id="feed-status"><span class="dot"></span><span id="feed-word">Idle</span></span>
        <span class="meta-pair">
          <span class="label">Snapshot</span>
          <span class="row-value" id="generated-at">—</span>
        </span>
        <a href="/new-invoice.html" class="link link--arrow">Create an invoice →</a>
      </div>

      <div class="controls">
        <div class="control control--wide">
          <div class="field-head"><label class="label" for="scope">Merchant</label></div>
          <select id="scope" class="input input--mono">
            <option value="__global__">All merchants</option>
          </select>
        </div>

        <div class="control control--id hidden" id="custom-scope">
          <div class="field-head"><label class="label" for="custom-id">Merchant ID</label></div>
          <input type="text" id="custom-id" class="input input--mono" spellcheck="false"
                 autocomplete="off" placeholder="00000000-0000-0000-0000-000000000000" />
        </div>
        <button type="button" id="custom-apply" class="btn btn--auto hidden">Use</button>

        <div class="control control--narrow">
          <div class="field-head"><label class="label" for="limit">Journals</label></div>
          <select id="limit" class="input input--mono">
            <option value="25">25</option>
            <option value="60" selected>60</option>
            <option value="120">120</option>
            <option value="250">250</option>
            <option value="500">500</option>
          </select>
        </div>

        <button type="button" id="auto" class="btn btn--ghost btn--auto">Auto refresh off</button>
        <button type="button" id="refresh" class="btn btn--auto">Refresh</button>
      </div>
    </div>
  </header>

  <div id="error-box" class="warning warning--stop hidden"></div>

  <!-- Summary strip -->
  <section class="strip">
    <div class="tags" id="tags"></div>
  </section>

  <!-- Body -->
  <div class="columns">

    <div class="col col--main">

      <section class="panel">
        <div class="panel-head">
          <span class="label">Positions</span>
          <span class="label label--faint" id="positions-count">—</span>
        </div>
        <div id="positions" class="cards reserve-140"></div>
      </section>

      <!-- Journals — the live region -->
      <section class="panel panel--fill" id="journals-panel">
        <div class="panel-head">
          <span class="label">Journals</span>
          <span class="label label--faint" id="journals-count">—</span>
        </div>
        <div id="journals" class="scroller reserve-240"></div>
      </section>

    </div>

    <div class="col col--side">

      <section class="panel">
        <div class="panel-head">
          <span class="label">Reconciliation</span>
          <span class="label label--faint">Ledger against queue</span>
        </div>
        <div id="reconciliation" class="reserve-100"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="label">Sweep backlog</span>
          <span class="label label--faint" id="backlog-count">—</span>
        </div>
        <div id="backlog" class="reserve-100"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span class="label">Accounts</span>
          <span class="label label--faint" id="accounts-count">—</span>
        </div>
        <div id="accounts" class="reserve-100"></div>
      </section>

    </div>

  </div>

</div>

<script type="module" src="/src/ledger.ts"></script>
</body>
</html>
